[package]
name = "compass"
version = "0.2.4"
description = "CompassZha 人生仪表盘 · 主工程（阶段 1+）"
edition = "2021"

# 大幅缩减编译产物的包体积
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[lib]
name = "compass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
# v4.25 §2.13：数据一键导出（整包 data 目录为 zip；只开 deflate 压缩，最小依赖）
zip = { version = "2", default-features = false, features = ["deflate"] }
# v4.26 §2.14：语料导入（epub/pdf → md，纯 Rust 无外部二进制依赖）
epub-parser = "0.3"
pdf_oxide = "0.3"
# v4.26 修正：文件对话框改用 Tauri 官方插件（rfd 在 async 命令线程里 Windows 对话框弹不出/静默返回空）
tauri-plugin-dialog = "2"
