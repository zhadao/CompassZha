<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">
  <title>CompassZha 人生仪表盘：本地优先，日记、日程、专注与趋势全部是纯 Markdown 文件</title>
  <defs>
    <pattern id="dg" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#0d1117"/>
      <circle cx="13" cy="13" r="1.1" fill="#1b2330"/>
    </pattern>
  </defs>

  <!-- 背景画布 -->
  <rect width="1200" height="360" rx="18" fill="url(#dg)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="17.5" fill="none" stroke="#262d36"/>

  <!-- ══ 左侧：标题区 ══ -->
  <!-- 眉题 -->
  <rect x="64" y="56" width="316" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
  <circle cx="84" cy="71" r="4" fill="#f6beca"/>
  <text x="96" y="77" font-size="19" fill="#8b949e">本地优先 · 无云端 · 数据归你</text>

  <!-- 主标题 -->
  <text x="62" y="150" font-size="58" font-weight="700" fill="#f0f6fc" letter-spacing="0.5">CompassZha<tspan font-size="32" font-weight="600" fill="#c9d1d9" dx="6">· 人生仪表盘</tspan></text>

  <!-- 四主题色条（红黄蓝绿四组色卡的具象化） -->
  <rect x="64" y="172" width="110" height="5" rx="2.5" fill="#f6beca"/>
  <rect x="188" y="172" width="110" height="5" rx="2.5" fill="#ebd014"/>
  <rect x="312" y="172" width="110" height="5" rx="2.5" fill="#5ab002"/>
  <rect x="436" y="172" width="110" height="5" rx="2.5" fill="#4581c7"/>

  <!-- 副标语 -->
  <text x="64" y="222" font-size="21" fill="#8b949e">你的日记、日程、专注与趋势，全部写成纯 Markdown 文件；</text>
  <text x="64" y="252" font-size="21" fill="#8b949e">没有云端、没有账号、没有数据库，只存在你自己的硬盘上。</text>

  <!-- 三个灵魂问题 chips -->
  <g font-size="20">
    <rect x="64" y="282" width="186" height="40" rx="20" fill="#4581c7" fill-opacity="0.13" stroke="#4581c7" stroke-width="1.4"/>
    <circle cx="88" cy="302" r="4" fill="#74a0d5"/>
    <text x="100" y="309" fill="#e6edf3">今天该干什么？</text>

    <rect x="266" y="282" width="206" height="40" rx="20" fill="#5ab002" fill-opacity="0.13" stroke="#5ab002" stroke-width="1.4"/>
    <circle cx="290" cy="302" r="4" fill="#8cc84e"/>
    <text x="302" y="309" fill="#e6edf3">今天状态怎么样？</text>

    <rect x="488" y="282" width="166" height="40" rx="20" fill="#f6beca" fill-opacity="0.13" stroke="#c598a2" stroke-width="1.4"/>
    <circle cx="512" cy="302" r="4" fill="#f6beca"/>
    <text x="524" y="309" fill="#e6edf3">我在往哪走？</text>
  </g>

  <!-- ══ 右侧：罗盘（源自主 logo 的罗盘指针母题） ══ -->
  <g>
    <circle cx="980" cy="160" r="104" fill="#11161d" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="980" cy="160" r="82" fill="none" stroke="#21262d"/>
    <line x1="898" y1="160" x2="1062" y2="160" stroke="#21262d"/>
    <line x1="980" y1="78" x2="980" y2="242" stroke="#21262d"/>
    <!-- 刻度 -->
    <g stroke="#30363d" stroke-width="1.5">
      <line x1="980" y1="58" x2="980" y2="66"/>
      <line x1="980" y1="254" x2="980" y2="262"/>
      <line x1="878" y1="160" x2="886" y2="160"/>
      <line x1="1074" y1="160" x2="1082" y2="160"/>
      <line x1="911" y1="91" x2="917" y2="97"/>
      <line x1="1043" y1="223" x2="1049" y2="229"/>
      <line x1="1049" y1="91" x2="1043" y2="97"/>
      <line x1="917" y1="223" x2="911" y2="229"/>
    </g>
    <!-- 四方位：四主题色 -->
    <polygon points="980,72 998,142 980,160 962,142" fill="#f6beca"/>
    <polygon points="1068,160 998,142 980,160 998,178" fill="#ebd014"/>
    <polygon points="980,248 962,178 980,160 998,178" fill="#5ab002"/>
    <polygon points="892,160 962,178 980,160 962,142" fill="#4581c7"/>
    <!-- 指针 -->
    <g transform="rotate(45 980 160)">
      <polygon points="980,84 994,160 966,160" fill="#e6edf3"/>
      <polygon points="980,236 994,160 966,160" fill="#6e7681"/>
    </g>
    <circle cx="980" cy="160" r="11" fill="#0d1117" stroke="#e6edf3" stroke-width="2"/>
    <!-- 方位字母 -->
    <g font-size="18" font-weight="600" fill="#8b949e" text-anchor="middle">
      <text x="980" y="48">N</text>
      <text x="1106" y="167">E</text>
      <text x="980" y="290">S</text>
      <text x="854" y="167">W</text>
    </g>
  </g>

  <!-- ══ 右下：Markdown 日记卡片（AI Native 数据格式的具象化） ══ -->
  <g font-family="Consolas,'Courier New',monospace">
    <rect x="688" y="250" width="272" height="92" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="708" y="277" font-size="18" fill="#8b949e">daily/2026-10-17.md</text>
    <text x="708" y="303" font-size="18" fill="#8bb0dc">mood: 4 · steps: 8200</text>
    <rect x="706" y="314" width="14" height="14" rx="3.5" fill="#5ab002" fill-opacity="0.18" stroke="#8cc84e" stroke-width="1.4"/>
    <path d="M709 321 L712 324.5 L717.5 317.5" stroke="#8cc84e" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="728" y="327" font-size="18" fill="#e6edf3">写周报 <tspan fill="#8cc84e">#goal/事业</tspan></text>
  </g>
</svg>
